<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengurusan PASTI · ePASTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css?v=10">
</head>
<body>
<div class="pt-app" data-module="pengurusan" data-page="pasti-pengurusan" data-title="Pengurusan PASTI" data-subtitle="Senarai PASTI cawangan · data dimuat naik oleh Pentadbir Negeri">
  <main class="pt-main">

    <div class="page-head">
      <div>
        <div class="crumb">ePASTI <span>›</span> Pengurusan PASTI &amp; Murid <span>›</span> Pengurusan PASTI</div>
        <h1>Pengurusan PASTI</h1>
        <div class="lead">Kawasan Kota Bharu · Parlimen P021 Kota Bharu · Kelantan</div>
      </div>
    </div>

    <!-- Senarai PASTI Cawangan (fasa 1: data dimuat naik oleh Pentadbir Negeri melalui Excel) -->
    <div data-panel="cawangan">
      <div class="card">
        <div class="card-body">
          <div class="toolbar">
            <div class="input-group"><input type="text" placeholder="Cari kod / nama PASTI…"></div>
            <div class="spacer"></div>
            <span data-own data-tiers="negeri" class="flex gap wrap">
              <button class="btn btn-soft btn-sm" id="ppTpl">Templat Excel</button>
              <button class="btn btn-primary btn-sm" id="ppUp">Muat Naik Excel</button>
              <input type="file" id="ppFile" accept=".xlsx,.xls,.csv" hidden>
            </span>
            <button class="btn btn-ghost btn-sm" data-toast="Menyediakan Excel…">Excel</button>
            <button class="btn btn-ghost btn-sm" data-action="print">Cetak</button>
          </div>
          <div class="table-wrap">
            <table class="pt" data-nosave>
              <thead>
                <tr>
                  <th>Bil</th><th>Kod PASTI</th><th>No Pendaftaran</th><th>Nama PASTI</th><th>Bil Guru</th><th>Bil Murid</th><th>Alamat</th><th>No Telefon</th><th>Negeri</th><th>Parlimen</th><th>DUN</th><th>Pentadbir Cawangan</th><th>Pendaftaran</th><th>Tindakan</th>
                </tr>
              </thead>
              <tbody id="pp3"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../assets/js/app.js?v=11"></script>
<script>
// Pengurusan PASTI — driven by the shared DB.
// Fasa 1: no online PASTI registration. Pentadbir Negeri uploads its state's PASTI from Excel (template below);
// rows are matched on Kod PASTI (update) or added. Then DUN cipta Pentadbir Cawangan → Kawasan buka pendaftaran murid.
(function(){
  const tier = PT.tier, $ = id => document.getElementById(id);
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const today = () => { const d = new Date(); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear(); };
  const cls = s => /buka/i.test(s) ? 'b-green' : /tutup/i.test(s) ? 'b-red' : 'b-blue';
  const badge = s => `<span class="badge ${cls(s)}">${esc(s)}</span>`;
  const admin = p => DB.find('users', u => u.peranan === 'cawangan' && u.skop === p.nama);
  // each tier sees only the PASTI inside its own skop (Negeri → state, Kawasan → parlimen, DUN → its DUN, Cawangan → own PASTI)
  const me = (PT.user !== undefined ? PT.user : DB.user()), same = (a, b) => String(a || '').toUpperCase() === String(b || '').toUpperCase();
  const mine = p => !me || tier === 'pusat' || (tier === 'negeri' ? same(p.negeri, me.skop) : tier === 'kawasan' ? same(p.kawasan, me.skop) : tier === 'dun' ? same(p.dun, me.skop) : tier === 'cawangan' ? same(p.nama, me.skop) : true);
  // lead line reflects the real scope
  const lead = document.querySelector('.page-head .lead');
  const SC = PT.scope || {}, where = [SC.label || (me ? me.skop : 'Semua Negeri PASTI'), tier === 'negeri' ? '' : SC.negeri].filter((v, i, a) => v && a.indexOf(v) === i).join(' · ');
  if (lead) lead.textContent = (DB.ROLE_LABEL[tier] || 'Pentadbir') + ' · ' + where
    + (tier === 'negeri' ? ' · muat naik data PASTI melalui Excel' : '');
  function draw(){
    const all = DB.all('pasti');
    const idx = p => all.indexOf(p);
    const live = all.filter(p => mine(p) && p.status === 'Lulus' && p.kod);
    $('pp3').innerHTML = live.map((p,n) => { const a = admin(p);
      return `<tr><td class="num">${n+1}</td><td><b>${p.kod}</b></td><td>${esc(p.no)}</td><td>${esc(p.nama)}</td><td class="num">${p.guru||0}</td><td class="num">${p.murid||0}</td><td>${esc(p.alamat)}</td><td class="num">${esc(p.tel)}</td>
      <td>${p.negeri}</td><td>${p.kawasan}</td><td>${p.dun}</td>
      <td>${a ? esc(a.nama) : '<span class="badge b-amber no-dot">Belum ada</span><div class="muted" style="font-size:11.5px;margin-top:3px">DUN perlu cipta akaun</div>'}</td>
      <td>${badge(p.daftar || 'TUTUP')}</td>
      <td class="flex gap wrap"><button class="btn btn-soft btn-sm">Lihat</button>${tier === 'kawasan' ? ` <span data-own><button class="btn btn-ghost btn-sm" data-pp="daftar" data-i="${idx(p)}">${p.daftar === 'BUKA' ? 'Tutup Pendaftaran' : 'Buka Pendaftaran'}</button></span>` : ''}${tier === 'dun' && !a ? ' <a class="btn btn-primary btn-sm" href="tetapan.html?t=pentadbir">Cipta Pentadbir</a>' : ''}</td></tr>`; }).join('');
  }

  // reason / result dialog
  function dialog(title, body, foot){
    let ov = $('ppDlg'); if (!ov) { ov = document.createElement('div'); ov.className = 'modal-overlay'; ov.id = 'ppDlg'; document.body.appendChild(ov); }
    ov.innerHTML = `<div class="modal"><div class="m-head"><h3>${title}</h3><button class="btn btn-ghost btn-sm" data-close>✕</button></div><div class="m-body">${body}</div><div class="m-foot" data-own>${foot}</div></div>`;
    ov.classList.add('open'); return ov;
  }
  const by = { negeri:'Pentadbir Negeri', pusat:'Pentadbir Pusat', kawasan:'Pentadbir Kawasan', dun:'Pentadbir DUN' }[tier] || tier;
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-pp]'); if (!b) return;
    const p = DB.all('pasti')[+b.dataset.i]; if (!p) return;
    const act = b.dataset.pp;
    if (act === 'daftar') { p.daftar = p.daftar === 'BUKA' ? 'TUTUP' : 'BUKA'; DB.save(); draw(); PT.toast('Pendaftaran murid ' + p.nama + ' ' + (p.daftar === 'BUKA' ? 'dibuka' : 'ditutup'), p.daftar === 'BUKA' ? 'green' : 'red'); }
  });

  // ---- Excel upload (Pentadbir Negeri only; negeri is forced to the admin's own state)
  const COLS = ['Kod PASTI','No Pendaftaran','Nama PASTI','Alamat','No Telefon','Parlimen','DUN','Bil Guru','Bil Murid'];
  const tplBtn = $('ppTpl'), upBtn = $('ppUp'), file = $('ppFile');
  if (tier !== 'negeri' || !window.XLSX) { [tplBtn, upBtn].forEach(x => x && x.parentNode.remove()); }
  else {
    tplBtn.onclick = () => { const ws = XLSX.utils.aoa_to_sheet([COLS, ['D030199','D/199/2026','PASTI CONTOH','No 1, Jalan Contoh','09-000 0000','P021 KOTA BHARU','N09 KOTA LAMA',5,30]]);
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'PASTI'); XLSX.writeFile(wb, 'Templat_Data_PASTI.xlsx'); };
    upBtn.onclick = () => { file.value = ''; file.click(); };
    file.onchange = async () => {
      const f = file.files[0]; if (!f) return;
      let rows; try { const wb = XLSX.read(await f.arrayBuffer()); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'', raw:false }); }
      catch(err){ PT.toast('Fail Excel tidak dapat dibaca', 'red'); return; }
      const key = k => String(k).toLowerCase().replace(/[^a-z]/g,''), get = (r, c) => { const k = Object.keys(r).find(x => key(x) === key(c)); return k ? String(r[k]).trim() : ''; };
      const ok = [], bad = [];
      rows.forEach((r, n) => { const o = {}; COLS.forEach(c => o[c] = get(r, c));
        const miss = ['Kod PASTI','Nama PASTI','Parlimen','DUN'].filter(c => !o[c]);
        (miss.length ? bad : ok).push(miss.length ? 'Baris ' + (n + 2) + ': tiada ' + miss.join(', ') : o); });
      if (!ok.length) { dialog('Muat Naik Excel', '<div class="notice red"><div class="tx"><b>Tiada baris sah.</b><span>' + (bad.slice(0,8).map(esc).join('<br>') || 'Fail kosong.') + '</span></div></div>', '<button class="btn btn-primary" data-close>Tutup</button>'); return; }
      const neg = String(me ? me.skop : '').toUpperCase(), all = DB.all('pasti');
      const exist = o => all.find(p => p.kod && p.kod.toUpperCase() === o['Kod PASTI'].toUpperCase());
      const upd = ok.filter(exist).length;
      dialog('Muat Naik Excel — ' + esc(f.name), `<div class="notice"><div class="tx"><b>${ok.length} PASTI sedia dimuat naik ke ${esc(neg)}</b><span>${ok.length - upd} baharu · ${upd} dikemas kini (padanan Kod PASTI)${bad.length ? ' · ' + bad.length + ' baris diabaikan' : ''}</span></div></div>`
        + (bad.length ? '<div class="muted mt" style="font-size:12px">' + bad.slice(0,8).map(esc).join('<br>') + '</div>' : ''),
        '<button class="btn btn-ghost" data-close>Batal</button><button class="btn btn-primary" id="ppSave">Simpan</button>');
      $('ppSave').onclick = () => {
        ok.forEach(o => { const v = { kod:o['Kod PASTI'].toUpperCase(), no:o['No Pendaftaran'] || '—', nama:o['Nama PASTI'].toUpperCase(), alamat:o['Alamat'], tel:o['No Telefon'],
            negeri:neg, kawasan:o['Parlimen'].toUpperCase(), dun:o['DUN'].toUpperCase(), guru:+o['Bil Guru'] || 0, murid:+o['Bil Murid'] || 0 };
          const p = exist(o); if (p) Object.assign(p, v);
          else all.push(Object.assign({ tarikh:today(), status:'Lulus', daftar:'TUTUP', sejarah:[{ by, act:'Muat naik Excel', at:today() }] }, v)); });
        DB.save(); $('ppDlg').classList.remove('open'); draw();
        try { PT.logAccess('Muat naik data PASTI (Excel)', 'Pengurusan PASTI', f.name + ' · ' + ok.length + ' rekod'); } catch(e){}
        PT.toast(ok.length + ' rekod PASTI disimpan'); };
    };
  }
  draw();
})();
</script>
</body>
</html>
