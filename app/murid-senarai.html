<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Senarai Murid · ePASTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css?v=8">
</head>
<body>
<div class="pt-app" data-module="pengurusan" data-page="murid-senarai" data-title="Senarai Murid" data-subtitle="Senarai penuh murid berdaftar">
  <main class="pt-main">

    <div class="page-head">
      <div>
        <div class="crumb">ePASTI <span>›</span> Pengurusan PASTI &amp; Murid <span>›</span> Senarai Murid</div>
        <h1>Senarai Murid</h1>
        <div class="lead"><span class="muted">Jumlah Bilangan = 179</span> · PASTI Kawasan Kota Bharu</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="input-group">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" placeholder="Cari nama murid, MyKid, PASTI…">
      </div>
      <div class="spacer"></div>
      <button class="btn btn-ghost" data-action="print" title="Cetak">Cetak</button>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table class="pt">
          <thead>
            <tr>
              <th>Bil</th><th>Nama Murid</th><th>MyKid / Dokumen Rasmi</th>
              <th>Ibu Bapa / Waris / Penjaga</th><th>PASTI</th>
              <th>Status Pendaftaran</th><th>Tindakan</th>
            </tr>
          </thead>
          <tbody id="muridRows"></tbody>
        </table>
      </div>
      <div class="pager">
        <div class="info">Memaparkan 1–12 daripada 179 rekod</div>
        <div class="pages">
          <button class="active">1</button>
          <button>2</button>
          <button>3</button>
          <button>4</button>
          <button>…</button>
          <button>15</button>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="../assets/js/app.js?v=8"></script>
<script>
(function(){
  const data = [
    ['ROZITA ASMA BINTI IZZUDDIN','210817032711','IZZUDDIN BIN LUTFI','AR-RAIHAN'],
    ['MUHAMMAD ZAKWAN IQMAL BIN RAFIE','200629031454','RAFIE BIN MUSTAQIM','AL-QAYYUM'],
    ['RAIHANA FAUZIAH BINTI WAFIY','211105035584','WAFIY BIN AFIQ','AL-MUNAWWARAH'],
    ['ZAIM TAQIUDDIN BIN MARWAN','200418037706','MARWAN BIN MAZLAN','BAITUL ILMI'],
    ['IFFAH MAWADDAH BINTI HUZAIFAH','210312033105','HUZAIFAH BIN RASYDAN','AR-RAIHAN'],
    ['MUHAMMAD OMAR BIN MUAZ','201002038396','MUAZ BIN IKHWAN','AL-QAYYUM'],
    ['DHIA HANA BINTI JAZLI','211220034016','JAZLI BIN DARWISY','AL-MUNAWWARAH'],
    ['MUHAMMAD LUQMANUL BIN NASRUL','200521037863','NASRUL BIN KAMIL','BAITUL ILMI'],
    ['SURAYA ROSMANIZA BINTI UMAIR','200811032159','UMAIR BIN FIRDAUS','AR-RAIHAN'],
    ['MUHAMMAD GHAZI BIN NUAIM','201118034346','NUAIM BIN ZIKRI','AL-QAYYUM'],
    ['ZAHRA QISTINA BINTI ASRI','210206035117','ASRI BIN YAZID','AL-MUNAWWARAH'],
    ['MUHAMMAD ANAS BIN FADHIL','200924034237','FADHIL BIN WAJDI','BAITUL ILMI'],
  ];
  function initials(name){ const p=name.split(' '); return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase(); }
  document.getElementById('muridRows').innerHTML = data.map((r,i)=>`<tr>
    <td>${i+1}</td>
    <td>
      <div class="cell-user">
        <div class="avatar">${initials(r[0])}</div>
        <div><div class="nm">${r[0]}</div><div class="ml">Murid PASTI ${r[3]}</div></div>
      </div>
    </td>
    <td><span class="num">${r[1]}</span><div class="muted" style="font-size:11.5px">MyKid</div></td>
    <td>${r[2]}<div class="muted" style="font-size:11.5px">Bapa / Penjaga</div></td>
    <td>PASTI ${r[3]}</td>
    <td><span class="badge b-teal">Murid</span></td>
    <td>
      <button class="btn btn-soft btn-sm" title="Lihat">Lihat</button>
      <button class="btn btn-ghost btn-sm" title="Edit">Edit</button>
    </td>
  </tr>`).join('');
})();
</script>
</body>
</html>
