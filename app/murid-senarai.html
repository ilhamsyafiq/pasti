<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Senarai Murid · ePASTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css?v=10">
</head>
<body>
<div class="pt-app" data-module="pengurusan" data-page="murid-senarai" data-title="Senarai Murid" data-subtitle="Senarai penuh murid berdaftar">
  <main class="pt-main">

    <div class="page-head">
      <div>
        <div class="crumb">ePASTI <span>›</span> Pengurusan PASTI &amp; Murid <span>›</span> Senarai Murid</div>
        <h1>Senarai Murid</h1>
        <div class="lead"><span class="muted" data-count>Jumlah Bilangan = 179</span> · <span data-scope-label>PASTI Kawasan Kota Bharu</span></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="input-group">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" placeholder="Cari nama murid, MyKid, PASTI…">
      </div>
      <div class="spacer"></div>
      <button class="btn btn-ghost" data-action="print" title="Cetak">Cetak</button>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table class="pt" data-nosave>
          <thead>
            <tr>
              <th>Bil</th><th>Nama Murid</th><th>MyKid / Dokumen Rasmi</th>
              <th>Ibu Bapa / Waris / Penjaga</th><th>PASTI</th>
              <th>Status Pendaftaran</th><th>Tindakan</th>
            </tr>
          </thead>
          <tbody id="muridRows"></tbody>
        </table>
      </div>
      <div class="pager">
        <div class="info">Memaparkan 1–12 daripada 179 rekod</div>
        <div class="pages">
          <button class="active">1</button>
          <button>2</button>
          <button>3</button>
          <button>4</button>
          <button>…</button>
          <button>15</button>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="../assets/js/app.js?v=11"></script>
<script>
(function(){
  const data = [
    ['ROZITA ASMA BINTI IZZUDDIN','210817032711','IZZUDDIN BIN LUTFI','AR-RAIHAN'],
    ['MUHAMMAD ZAKWAN IQMAL BIN RAFIE','200629031454','RAFIE BIN MUSTAQIM','AL-QAYYUM'],
    ['RAIHANA FAUZIAH BINTI WAFIY','211105035584','WAFIY BIN AFIQ','AL-MUNAWWARAH'],
    ['ZAIM TAQIUDDIN BIN MARWAN','200418037706','MARWAN BIN MAZLAN','BAITUL ILMI'],
    ['IFFAH MAWADDAH BINTI HUZAIFAH','210312033105','HUZAIFAH BIN RASYDAN','AR-RAIHAN'],
    ['MUHAMMAD OMAR BIN MUAZ','201002038396','MUAZ BIN IKHWAN','AL-QAYYUM'],
    ['DHIA HANA BINTI JAZLI','211220034016','JAZLI BIN DARWISY','AL-MUNAWWARAH'],
    ['MUHAMMAD LUQMANUL BIN NASRUL','200521037863','NASRUL BIN KAMIL','BAITUL ILMI'],
    ['SURAYA ROSMANIZA BINTI UMAIR','200811032159','UMAIR BIN FIRDAUS','AR-RAIHAN'],
    ['MUHAMMAD GHAZI BIN NUAIM','201118034346','NUAIM BIN ZIKRI','AL-QAYYUM'],
    ['ZAHRA QISTINA BINTI ASRI','210206035117','ASRI BIN YAZID','AL-MUNAWWARAH'],
    ['MUHAMMAD ANAS BIN FADHIL','200924034237','FADHIL BIN WAJDI','BAITUL ILMI'],
  ];
  function initials(name){ const p=name.split(' '); return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase(); }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // accepted students from the shared DB first, then the static sample rows (duplicates dropped)
  const dbm = (window.DB && DB.all) ? DB.all('murid').filter(m => m.status === 'Diterima') : [];
  const seen = new Set(); dbm.forEach(m => { seen.add(String(m.mykid)); seen.add(String(m.nama).toUpperCase()); });
  const rows = dbm.map(m => ({ nama:m.nama, mykid:m.mykid, bapa:m.bapa || '—', pasti:String(m.pasti || '').replace(/^PASTI\s+/i,'') }))
    .concat(data.filter(r => !seen.has(r[1]) && !seen.has(r[0].toUpperCase())).map(r => ({ nama:r[0], mykid:r[1], bapa:r[2], pasti:r[3] })));
  document.getElementById('muridRows').innerHTML = rows.map((r,i)=>`<tr>
    <td>${i+1}</td>
    <td>
      <div class="cell-user">
        <div class="avatar">${initials(r.nama)}</div>
        <div><div class="nm">${esc(r.nama)}</div><div class="ml">Murid PASTI ${esc(r.pasti)}</div></div>
      </div>
    </td>
    <td><span class="num">${esc(r.mykid)}</span><div class="muted" style="font-size:11.5px">MyKid</div></td>
    <td>${esc(r.bapa)}<div class="muted" style="font-size:11.5px">Bapa / Penjaga</div></td>
    <td>PASTI ${esc(r.pasti)}</td>
    <td><span class="badge b-teal">Murid</span></td>
    <td>
      <button class="btn btn-soft btn-sm" title="Lihat">Lihat</button>
      <button class="btn btn-ghost btn-sm" title="Edit" data-tiers="cawangan">Edit</button>
    </td>
  </tr>`).join('');

  // After the engine has scoped the rows: count & pager show only what this user can see.
  document.addEventListener('DOMContentLoaded', () => setTimeout(() => {
    const tb = document.querySelector('table.pt'), el = document.querySelector('[data-count]'), pg = document.querySelector('.pager');
    const sl = document.querySelector('[data-scope-label]');
    if (sl && window.PT && PT.scope && PT.scope.label) sl.textContent = PT.scope.label;
    const count = () => { if (!tb || !el) return;
      const n = [...tb.tBodies[0].rows].filter(r => r.style.display !== 'none').length;
      el.textContent = 'Jumlah Bilangan = ' + n;
      if (pg) { pg.querySelector('.info').textContent = n ? 'Memaparkan 1–' + n + ' daripada ' + n + ' rekod' : 'Tiada rekod'; pg.querySelector('.pages').innerHTML = '<button class="active">1</button>'; }
    };
    count();
    ['input','change'].forEach(ev => document.addEventListener(ev, () => setTimeout(count, 0)));
    if (tb) new MutationObserver(() => setTimeout(count, 0)).observe(tb.tBodies[0], { childList:true });
  }, 0));
})();
</script>
</body>
</html>
