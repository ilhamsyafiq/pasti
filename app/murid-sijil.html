<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cetak Sijil Tamat Sekolah Murid · ePASTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css?v=4">
</head>
<body>
<div class="pt-app" data-module="pengurusan" data-page="murid-sijil" data-title="Cetak Sijil Tamat Sekolah Murid" data-subtitle="Sijil tamat sekolah murid tahun akhir">
  <main class="pt-main">

    <div class="page-head">
      <div>
        <div class="crumb">ePASTI <span>›</span> Pengurusan PASTI &amp; Murid <span>›</span> Cetak Sijil Tamat Sekolah</div>
        <h1>Cetak Sijil Tamat Sekolah Murid</h1>
        <div class="lead"><span class="muted">Jumlah Bilangan = 6</span> · Murid tahun akhir · PASTI Kawasan Kubang Kerian</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="input-group">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" placeholder="Cari nama murid, MyKid, PASTI…">
      </div>
      <div class="spacer"></div>
      <button class="btn btn-ghost" data-action="print" title="Cetak">Cetak</button>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table class="pt">
          <thead>
            <tr>
              <th><input type="checkbox" title="Pilih semua"></th>
              <th>Bil</th><th>Nama Murid (Rumi)</th><th>Nama Murid (Jawi)</th>
              <th>MyKid / Dokumen</th><th>Ibu Bapa / Waris</th><th>PASTI</th>
              <th>Status Pendaftaran</th><th>Cetak Sijil Jawi</th><th>Cetak Sijil Rumi</th>
            </tr>
          </thead>
          <tbody id="sijilRows"></tbody>
        </table>
      </div>
    </div>

    <div class="toolbar mt">
      <div class="spacer"></div>
      <button class="btn btn-primary" data-action="print" title="Cetak Sijil Tamat Sekolah Jawi">Cetak Sijil Tamat Sekolah Jawi</button>
      <button class="btn btn-primary" data-action="print" title="Cetak Sijil Tamat Sekolah Rumi">Cetak Sijil Tamat Sekolah Rumi</button>
    </div>

  </main>
</div>

<script src="../assets/js/app.js?v=4"></script>
<script>
(function(){
  const data = [
    ['DANIA HUMAIRA BINTI TAJUDDIN','دانيا حميرا بنت تاج الدين','210817100455','TAJUDDIN BIN MAHMUD','AL-TA\'LIM'],
    ['MUHAMMAD RAFIQ HAIKAL BIN SAIFUL','محمد رفيق هيكل بن سيف','200629100812','SAIFUL BIN MANSOR','AS-SALAMAH'],
    ['AMMAR ZIKRULLAH BIN NASIR','عمار ذكر الله بن ناصر','200418100109','NASIR BIN LATIFF','ITQAN'],
    ['MUHAMMAD UWAIS BIN FADZLI','محمد أويس بن فضلي','201002100546','FADZLI BIN JOHARI','NURUL IMAN'],
    ['MUHAMMAD ILHAN BIN TARMIZI','محمد إلهان بن ترميذي','200521100271','TARMIZI BIN WAHAB','AL-TA\'LIM'],
    ['MUHAMMAD DANIYAL BIN SHAFIE','محمد دانيال بن شافعي','200924100416','SHAFIE BIN OSMAN','AS-SALAMAH'],
  ];
  document.getElementById('sijilRows').innerHTML = data.map((r,i)=>`<tr>
    <td><input type="checkbox"></td>
    <td>${i+1}</td>
    <td><b>${r[0]}</b></td>
    <td style="font-size:15px">${r[1]}</td>
    <td><span class="num">${r[2]}</span><div class="muted" style="font-size:11.5px">MyKid</div></td>
    <td>${r[3]}</td>
    <td>PASTI ${r[4]}</td>
    <td><span class="badge b-teal">Murid</span></td>
    <td><button class="btn btn-soft btn-sm" data-action="print" title="Cetak Sijil Jawi">Sijil Jawi</button></td>
    <td><button class="btn btn-soft btn-sm" data-action="print" title="Cetak Sijil Rumi">Sijil Rumi</button></td>
  </tr>`).join('');
})();
</script>
</body>
</html>
