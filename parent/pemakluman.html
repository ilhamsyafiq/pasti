<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Makluman & Pemberitahuan · ePASTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css?v=10">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2fa308">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="../assets/img/icons/icon-192.png">
</head>
<body>
<div class="pt-app" data-portal="parent" data-module="pemakluman" data-title="Makluman & Pemberitahuan" data-subtitle="Pengumuman & peringatan bayaran">
  <main class="pt-main">

    <section class="pp-hero">
      <div class="row">
        <div>
          <div class="crumbs">Portal Ibu Bapa › Makluman &amp; Pemberitahuan</div>
          <h1>Makluman &amp; Pemberitahuan</h1>
          <div class="lead">Pengumuman sekolah, program dan peringatan bayaran daripada PASTI AR-RAIHAN</div>
          <div class="mini" id="ppMini"></div>
        </div>
        <button class="btn btn-w" id="markAll">Tandakan semua dibaca</button>
      </div>
    </section>

    <div class="card">
      <div class="card-head" style="flex-wrap:wrap;gap:10px">
        <div class="pp-filter" id="ppFilter" data-own></div>
      </div>
      <div class="card-body pp-feed" style="padding-top:4px;padding-bottom:4px" id="notifList"></div>
    </div>

  </main>
</div>

<script src="../assets/js/app.js?v=11"></script>
<script src="../assets/js/parent-kids.js?v=6"></script>
<script>
  (function(){
    const I = PK.I, esc = PK.esc, $ = id => document.getElementById(id);
    const CAT = { bayaran:['Bayaran','pp-c3',I.yuran], makluman:['Makluman','pp-c5',I.makluman], program:['Program','pp-c4',I.program], prestasi:['Prestasi','pp-c2',I.prestasi] };
    const items = [
      { id:'y-ogos', c:'bayaran',  t:'Yuran Ogos 2026 belum dijelaskan', p:'Yuran Ahmad Umair bagi bulan Ogos (RM 60) masih tertunggak. Sila jelaskan segera.', dt:'23 Sep 2026', pay:60 },
      { id:'mag',    c:'makluman', t:"Mesyuarat Agung PASTI AR-RAIHAN", p:'Semua ibu bapa dijemput hadir pada Ahad, 5 Oktober 2026, 9:00 pagi di dewan PASTI.', dt:'20 Sep 2026' },
      { id:'hk',     c:'program',  t:'Program Motivasi & Hari Keluarga', p:'Sabtu, 4 Oktober 2026 · aktiviti keluarga, sukaneka dan jamuan. Pakaian: baju sukan PASTI.', dt:'16 Sep 2026' },
      { id:'sppm1',  c:'prestasi', t:'Penilaian SPPM Penggal 1 dihantar', p:'Guru kelas telah menghantar penilaian Penggal 1 bagi Ahmad Umair. Semak di Prestasi Anak.', dt:'15 Sep 2026', go:'prestasi.html' },
      { id:'cuti',   c:'makluman', t:'Cuti Pertengahan Penggal', p:'PASTI ditutup 13–21 September 2026. Kelas bermula semula Isnin, 22 September.', dt:'12 Sep 2026' },
      { id:'y-jul',  c:'bayaran',  t:'Yuran Julai 2026 telah dijelaskan — terima kasih', p:'Pembayaran RM 120 melalui Kad diterima. Resit boleh dimuat turun.', dt:'10 Julai 2026', go:'resit.html', done:true },
      { id:'daftar', c:'makluman', t:'Sesi Pendaftaran Semula Sesi 2026 dibuka', p:'Pendaftaran semula murid lama dibuka sehingga 31 Januari 2026.', dt:'5 Jan 2026' },
    ];
    const KEY = 'pt-pemakluman-read';
    let read = []; try { read = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){}
    if (!read.length) read = ['y-jul','daftar','cuti'];   // older items already seen
    let cat = 'semua';
    // Yuran Ogos: follow the parent bill table (engine-saved after a BayarCash payment)
    if (PK.billOpen && PK.billOpen('Ahmad Umair', 'Ogos') === false) { const y = items.find(x => x.id === 'y-ogos');
      Object.assign(y, { t:'Yuran Ogos 2026 telah dijelaskan — terima kasih', p:'Pembayaran yuran Ahmad Umair bagi bulan Ogos (RM 60) telah diterima. Resit boleh dimuat turun.', pay:0, go:'resit.html', done:true }); }

    function draw(){
      const unread = items.filter(x => !read.includes(x.id)).length;
      $('ppMini').innerHTML = '<div>Belum dibaca<b>' + unread + '</b></div><div>Jumlah makluman<b>' + items.length + '</b></div>';
      $('markAll').style.display = unread ? '' : 'none';
      const counts = { semua: items.length }; items.forEach(x => counts[x.c] = (counts[x.c] || 0) + 1);
      $('ppFilter').innerHTML = [['semua','Semua']].concat(Object.keys(CAT).map(k => [k, CAT[k][0]])).map(([k,n]) =>
        '<button type="button" data-cat="' + k + '" class="' + (k === cat ? 'on' : '') + '">' + n + '<span>' + (counts[k] || 0) + '</span></button>').join('');
      $('notifList').innerHTML = items.map(x => { const C = CAT[x.c], u = !read.includes(x.id);
        return '<div class="pp-fi' + (cat !== 'semua' && x.c !== cat ? ' hide' : '') + '" data-id="' + x.id + '">'
          + '<div class="ic ' + (x.done ? 'pp-c1' : C[1]) + '">' + (x.done ? I.ok : C[2]) + '</div>'
          + '<div class="tx"><b>' + esc(x.t) + '</b><p>' + esc(x.p) + '</p><div class="dt">' + x.dt + ' · ' + C[0] + '</div>'
          + (x.pay ? '<a class="btn btn-primary btn-sm" href="yuran.html" data-own>Bayar</a>' : x.go ? '<a class="btn btn-soft btn-sm" href="' + x.go + '">Lihat</a>' : '')
          + '</div>' + (u ? '<span class="tag-dot"></span>' : '') + '</div>'; }).join('');
    }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(read)); } catch(e){} };
    document.addEventListener('click', e => {
      const f = e.target.closest('[data-cat]'); if (f) { cat = f.dataset.cat; draw(); return; }
      const it = e.target.closest('.pp-fi'); if (it && !read.includes(it.dataset.id)) { read.push(it.dataset.id); save(); setTimeout(draw, 0); }
    });
    // engine handles the toast + bell; we persist the per-item read state
    $('markAll').addEventListener('click', () => { read = items.map(x => x.id); save(); setTimeout(draw, 0); });
    draw();
  })();
</script>
</body>
</html>
