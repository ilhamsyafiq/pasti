<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anak Saya · ePASTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css?v=7">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2fa308">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="../assets/img/icons/icon-192.png">
</head>
<body>
<div class="pt-app" data-portal="parent" data-module="anak" data-title="Anak Saya" data-subtitle="Portal Ibu Bapa PASTI">
  <main class="pt-main">

    <section class="pp-hero">
      <div class="row">
        <div>
          <div class="crumbs">Portal Ibu Bapa › Anak Saya</div>
          <h1>Anak Saya</h1>
          <div class="lead" id="ppLead">Senarai anak berdaftar di bawah jagaan anda</div>
          <div class="mini" id="ppMini"></div>
        </div>
        <a class="btn btn-w" href="../daftar-murid.html">+ Daftar Anak Baharu</a>
      </div>
    </section>

    <div class="pp-kids" id="ppKids"></div>

  </main>
</div>

<!-- detail modal (filled by script) -->
<div class="modal-overlay" id="anakModal">
  <div class="modal">
    <div class="m-head"><h3 id="anakModalT">Butiran Murid</h3><button class="btn btn-ghost btn-sm" data-close>✕</button></div>
    <div class="m-body" id="anakModalB"></div>
    <div class="m-foot"><button class="btn btn-ghost" data-close>Tutup</button></div>
  </div>
</div>

<script src="../assets/js/app.js?v=7"></script>
<script src="../assets/js/parent-kids.js?v=3"></script>
<script>
(function(){
  const { me, kids } = PK.load(), esc = PK.esc, $ = id => document.getElementById(id);
  $('ppLead').textContent = 'Senarai anak berdaftar di bawah jagaan ' + PK.title(me.nama);
  const ok = kids.filter(k => k.status === 'Diterima').length;
  $('ppMini').innerHTML = '<div>Anak berdaftar<b>' + kids.length + '</b></div><div>Murid aktif<b>' + ok + '</b></div>'
    + (kids.length - ok ? '<div>Dalam semakan<b>' + (kids.length - ok) + '</b></div>' : '');

  $('ppKids').innerHTML = kids.map((k,i) => {
    const c = PK.COLORS[i % 6], murid = k.status === 'Diterima';
    return '<div class="pp-kid"><div class="band ' + c + '"><span class="tag">' + (murid ? 'Murid' : 'Dalam semakan') + '</span></div>'
      + '<div class="who"><div class="av ' + c + '">' + PK.ini(k.nama) + '</div><div><div class="nm">' + esc(k.nama) + '</div><div class="ml">MyKid ' + esc(k.mykid) + '</div></div></div>'
      + '<div class="body">'
      + '<div class="stats">'
      +   '<div class="st"><div class="l">Kehadiran</div><div class="v ' + (k.hadir >= 90 ? 'ok' : '') + '">' + (k.hadir != null ? k.hadir + '%' : '—') + '</div></div>'
      +   '<div class="st"><div class="l">Yuran</div><div class="v ' + (k.tertunggak ? 'warn' : 'ok') + '">' + (!murid ? '—' : k.tertunggak ? 'RM ' + k.tertunggak : 'Selesai') + '</div></div>'
      +   '<div class="st"><div class="l">SPPM</div><div class="v">' + esc(k.prestasi) + '</div></div>'
      + '</div>'
      + '<dl class="meta"><dt>PASTI</dt><dd>' + esc(k.pasti) + '</dd><dt>Kelas</dt><dd>' + esc(k.kelas) + '</dd><dt>Guru Kelas</dt><dd>' + esc(k.guru) + '</dd><dt>No. Rujukan</dt><dd>' + esc(k.ref) + '</dd></dl>'
      + '<div class="acts"><button type="button" class="btn btn-soft btn-sm" data-own data-kid="' + i + '">Butiran</button>'
      + (murid ? '<a class="btn btn-ghost btn-sm" href="prestasi.html">Prestasi</a>' + (k.tertunggak ? '<a class="btn btn-primary btn-sm" href="yuran.html">Bayar Yuran</a>' : '')
               : '<a class="btn btn-ghost btn-sm" href="../semak-status.html?ref=' + encodeURIComponent(k.ref) + '&mykid=' + encodeURIComponent(k.mykid) + '">Semak Status</a>')
      + '</div></div></div>';
  }).join('') + '<a class="pp-kid add" href="../daftar-murid.html"><div class="plus">+</div><b>Daftar Anak Baharu</b><small>Perlukan Kod PASTI daripada PASTI pilihan</small></a>';

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-kid]'); if (!b) return;
    const k = kids[+b.dataset.kid], murid = k.status === 'Diterima';
    $('anakModalT').textContent = 'Butiran Murid — ' + k.pendek;
    $('anakModalB').innerHTML = '<dl class="kv"><dt>Nama Penuh</dt><dd>' + esc(k.nama) + '</dd><dt>MyKid</dt><dd>' + esc(k.mykid) + '</dd><dt>PASTI</dt><dd>' + esc(k.pasti) + '</dd>'
      + '<dt>No Rujukan</dt><dd>' + esc(k.ref) + '</dd><dt>Tarikh Daftar</dt><dd>' + esc(k.daftar) + '</dd><dt>Tahun / Kelas</dt><dd>' + esc(k.kelas) + '</dd><dt>Guru Kelas</dt><dd>' + esc(k.guru) + '</dd>'
      + '<dt>Status</dt><dd>' + (murid ? 'Murid' : 'Permohonan dalam semakan') + '</dd><dt>Yuran Bulanan</dt><dd>RM 60</dd>'
      + '<dt>Status Yuran</dt><dd>' + (!murid ? '—' : k.tertunggak ? '<span class="badge b-amber no-dot">Tertunggak RM ' + k.tertunggak + '</span>' : '<span class="badge b-green no-dot">Dijelaskan</span>') + '</dd></dl>';
    $('anakModal').classList.add('open');
  });
})();
</script>
</body>
</html>
